name: CI
on: [push, pull_request]
defaults:
  run:
    shell: bash
jobs:
  package_objects:
    name: Package Objects
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Copy Objects to Output Structure
        run: |
          find "objects" -mindepth 2 -maxdepth 2 -type d | while IFS= read -r category_dir; do
              category="$(basename "$category_dir")"
              dst_dir="./artifacts/objects/$category"

              mkdir -p "$dst_dir"
              find "$category_dir" -type f \( -iname '*.dat' \) | while IFS= read -r dat_file; do
                  filename="$(basename "$dat_file")"
                  cp -f "$dat_file" "$dst_dir/$filename"
              done
          done
      # fork：vanilla → OpenGraphics 別名表，給 OpenLoco fork 的別名層使用（ROADMAP D1-A）
      - name: Generate Object Aliases
        run: python3 tools/deps.py --aliases-yml artifacts/objects/aliases.yml
      - name: Package Objects
        run: cd artifacts/objects; zip ../../objects.zip ./* -r; cd ../..
      # fork：standalone 用的基礎資料（ROADMAP D3、M1）。目前 g1 為依 docs/g1-catalog.json 產生的 placeholder
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Base Data
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          python -m pip install pillow
          python tools/g1.py build -o artifacts/base/Data/g1.DAT
          cd artifacts/base; zip ../../base.zip -r .; cd ../..
      - name: Hash Packages
        run: |
          echo "SHA256=$(sha256sum objects.zip | cut -d " " -f 1)" >> $GITHUB_OUTPUT
          echo "BASE_SHA256=$(sha256sum base.zip | cut -d " " -f 1)" >> $GITHUB_OUTPUT
        id: hash
      - name: Upload artifacts (CI)
        uses: actions/upload-artifact@v7
        with:
          path: objects.zip
          archive: false
          if-no-files-found: error
      - name: Upload base artifacts (CI)
        uses: actions/upload-artifact@v7
        with:
          path: base.zip
          archive: false
          if-no-files-found: error
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: |
            objects.zip SHA256:${{ steps.hash.outputs.SHA256 }}
            base.zip SHA256:${{ steps.hash.outputs.BASE_SHA256 }}
          files: |
            objects.zip
            base.zip
